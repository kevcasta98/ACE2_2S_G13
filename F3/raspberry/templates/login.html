<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>PORTUS - Acceso</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: grid; place-items: center;
            font-family: Arial, sans-serif; background: #f4f4f4; color: #111;
        }
        .card { width: min(420px, calc(100% - 32px)); background: white; border: 1px solid #222; padding: 32px; }
        h1 { margin: 0 0 6px; font-size: 28px; }
        .sub { margin: 0 0 28px; color: #555; }
        label { display: block; font-weight: bold; margin: 16px 0 6px; }
        input { width: 100%; padding: 11px; border: 1px solid #555; font-size: 16px; }
        button { width: 100%; margin-top: 24px; padding: 12px; border: 0; background: #111; color: white; font-size: 16px; cursor: pointer; }
        .error { margin: 18px 0 0; padding: 10px; border: 1px solid #111; background: #eee; }
    </style>
</head>
<body>
<main class="card">
    <h1>PORTUS</h1>
    <p class="sub">Plataforma de supervisión y control</p>
    <form method="post">
        <label for="username">Usuario</label>
        <input id="username" name="username" autocomplete="username" required>
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Ingresar</button>
    </form>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
</main>
</body>
</html>
